<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="jakarta.faces.passthrough">

<ui:composition template="/templates/layout.xhtml">

    <ui:define name="title">Register - Bidly</ui:define>

    <ui:define name="content">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4">
                            <i class="bi bi-person-plus"></i> Create Account
                        </h3>

                        <ui:fragment rendered="#{registerBean.errorMessage != null}">
                            <div class="alert alert-danger">
                                #{registerBean.errorMessage}
                            </div>
                        </ui:fragment>

                        <h:form>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">First Name</label>
                                    <h:inputText value="#{registerBean.firstName}"
                                                 styleClass="form-control" maxlength="50"
                                                 required="true"
                                                 requiredMessage="First name is required."
                                                 p:placeholder="First name"/>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Last Name</label>
                                    <h:inputText value="#{registerBean.lastName}"
                                                 styleClass="form-control" maxlength="50"
                                                 required="true"
                                                 requiredMessage="Last name is required."
                                                 p:placeholder="Last name"/>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <h:inputText value="#{registerBean.username}"
                                             styleClass="form-control" maxlength="50"
                                             required="true"
                                             requiredMessage="Username is required."
                                             p:placeholder="Choose a username"/>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <h:inputText value="#{registerBean.email}"
                                             styleClass="form-control" maxlength="100"
                                             required="true"
                                             requiredMessage="Email is required."
                                             p:placeholder="user@example.com">
                                    <f:validator validatorId="emailValidator"/>
                                </h:inputText>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <h:inputSecret value="#{registerBean.password}"
                                               styleClass="form-control" maxlength="72"
                                               required="true"
                                               requiredMessage="Password is required."
                                               p:placeholder="Min 8 chars, upper, lower, digit">
                                    <f:validator validatorId="passwordStrengthValidator"/>
                                </h:inputSecret>
                                <div class="form-text">
                                    At least 8 characters with uppercase, lowercase and a digit.
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Confirm Password</label>
                                <h:inputSecret value="#{registerBean.confirmPassword}"
                                               styleClass="form-control" maxlength="72"
                                               required="true"
                                               requiredMessage="Confirm your password."
                                               p:placeholder="Re-enter password"/>
                            </div>

                            <h:commandButton value="Register"
                                             action="#{registerBean.register}"
                                             styleClass="btn btn-primary w-100 mb-3"/>

                            <h:messages styleClass="text-danger small" globalOnly="false"/>
                        </h:form>

                        <div class="text-center">
                            <p class="text-muted">
                                Already have an account?
                                <h:link outcome="/login" styleClass="link-primary">Login</h:link>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </ui:define>

</ui:composition>

</html>
