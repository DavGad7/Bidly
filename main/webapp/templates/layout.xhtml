<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core">

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title><ui:insert name="title">Bidly</ui:insert></title>

    <!-- Nunito from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&amp;display=swap"
          rel="stylesheet"/>

    <!-- Bootstrap 5 + Bootstrap Icons (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet"/>
    <!-- ?v=2 is only there so the browser doesn't keep the old cached css -->
    <link rel="stylesheet" href="#{request.contextPath}/resources/css/bidly.css?v=2"/>
</h:head>

<h:body>
    <!-- updates the unread count for the bell icon on every page load -->
    <f:event type="preRenderView" listener="#{navigationBean.refreshNotificationCount}"/>

    <nav class="navbar navbar-expand-lg navbar-dark bidly-navbar sticky-top">
        <div class="container">
            <h:link outcome="/index" styleClass="navbar-brand">
                <h:graphicImage library="images" name="bidly_logo.png"
                                styleClass="brand-logo" alt="Bidly"/>
            </h:link>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navbarMain"
                    aria-controls="navbarMain" aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <h:link outcome="/index" styleClass="nav-link">
                            <i class="bi bi-house"></i> Home
                        </h:link>
                    </li>

                    <ui:fragment rendered="#{navigationBean.loggedIn}">
                        <li class="nav-item">
                            <h:link outcome="/create-auction" styleClass="nav-link">
                                <i class="bi bi-plus-circle"></i> Create Auction
                            </h:link>
                        </li>
                        <li class="nav-item">
                            <h:link outcome="/my-auctions" styleClass="nav-link">
                                <i class="bi bi-list-ul"></i> My Auctions
                            </h:link>
                        </li>
                        <li class="nav-item">
                            <h:link outcome="/my-bids" styleClass="nav-link">
                                <i class="bi bi-cash-stack"></i> My Bids
                            </h:link>
                        </li>
                        <li class="nav-item">
                            <h:link outcome="/watchlist" styleClass="nav-link">
                                <i class="bi bi-heart"></i> Watchlist
                            </h:link>
                        </li>
                    </ui:fragment>

                    <ui:fragment rendered="#{navigationBean.admin}">
                        <li class="nav-item">
                            <h:link outcome="/admin/dashboard" styleClass="nav-link">
                                <i class="bi bi-shield-lock"></i> Admin
                            </h:link>
                        </li>
                    </ui:fragment>
                </ul>

                <ul class="navbar-nav">
                    <ui:fragment rendered="#{navigationBean.loggedIn}">
                        <li class="nav-item">
                            <h:link outcome="/notifications" styleClass="nav-link">
                                <i class="bi bi-bell"></i>
                                <ui:fragment rendered="#{navigationBean.unreadNotificationCount > 0}">
                                    <span class="badge bg-danger notification-badge">
                                        #{navigationBean.unreadNotificationCount}
                                    </span>
                                </ui:fragment>
                            </h:link>
                        </li>
                        <li class="nav-item">
                            <h:link outcome="/profile" styleClass="nav-link">
                                <i class="bi bi-person-circle"></i>
                                #{navigationBean.loggedInUser.username}
                            </h:link>
                        </li>
                        <li class="nav-item">
                            <h:form>
                                <h:commandLink action="#{navigationBean.logout}"
                                               styleClass="nav-link">
                                    <i class="bi bi-box-arrow-right"></i> Logout
                                </h:commandLink>
                            </h:form>
                        </li>
                    </ui:fragment>

                    <ui:fragment rendered="#{!navigationBean.loggedIn}">
                        <li class="nav-item">
                            <h:link outcome="/login" styleClass="nav-link">
                                <i class="bi bi-box-arrow-in-right"></i> Login
                            </h:link>
                        </li>
                        <li class="nav-item">
                            <h:link outcome="/register" styleClass="nav-link">
                                <i class="bi bi-person-plus"></i> Register
                            </h:link>
                        </li>
                    </ui:fragment>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <ui:insert name="content"/>
    </main>

    <footer class="bidly-footer">
        <div class="container">
            <div class="footer-brand">
                <h:graphicImage library="images" name="bidly_logo.png"
                                styleClass="footer-logo" alt="Bidly"/>
                <p class="mb-0">Bidly online auctions</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</h:body>

</html>
