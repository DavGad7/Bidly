<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">

<ui:composition template="/templates/layout.xhtml">

    <ui:define name="title">Watchlist - Bidly</ui:define>

    <ui:define name="content">
        <h3 class="mb-4"><i class="bi bi-heart"></i> My Watchlist</h3>

        <ui:fragment rendered="#{not empty watchlistBean.entries}">
            <div class="row g-4">
                <ui:repeat value="#{watchlistBean.entries}" var="entry">
                    <div class="col-sm-6 col-md-4 col-lg-3">
                        <div class="card auction-card shadow-sm h-100">
                            <ui:fragment rendered="#{entry.auction.thumbnailPhotoId != null}">
                                <img src="#{request.contextPath}/image?id=#{entry.auction.thumbnailPhotoId}"
                                     class="card-img-top"
                                     alt="#{entry.auction.title}"/>
                            </ui:fragment>
                            <ui:fragment rendered="#{entry.auction.thumbnailPhotoId == null}">
                                <div class="placeholder-img">
                                    <i class="bi bi-image"></i>
                                </div>
                            </ui:fragment>

                            <div class="card-body d-flex flex-column">
                                <h6 class="card-title">
                                    <h:link outcome="/auction" value="#{entry.auction.title}">
                                        <f:param name="id" value="#{entry.auction.id}"/>
                                    </h:link>
                                </h6>

                                <div class="mt-auto">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <span class="price-current">$#{entry.auction.currentPrice}</span>
                                        <span class="badge #{entry.auction.status == 'ACTIVE' ? 'badge-active' : 'badge-closed'}">
                                            #{entry.auction.status}
                                        </span>
                                    </div>
                                    <div class="text-muted small mb-2">
                                        <i class="bi bi-clock"></i> #{entry.auction.timeRemaining}
                                    </div>
                                    <h:form>
                                        <h:commandButton value="Remove"
                                                         action="#{watchlistBean.removeFromWatchlist(entry.auction.id)}"
                                                         styleClass="btn btn-outline-danger btn-sm w-100"/>
                                    </h:form>
                                </div>
                            </div>
                        </div>
                    </div>
                </ui:repeat>
            </div>
        </ui:fragment>

        <ui:fragment rendered="#{empty watchlistBean.entries}">
            <div class="empty-state">
                <i class="bi bi-heart"></i>
                <h4>Your watchlist is empty</h4>
                <p>Click Watch on an auction to add it here.</p>
                <h:link outcome="/index" styleClass="btn btn-primary">
                    Browse Auctions
                </h:link>
            </div>
        </ui:fragment>
    </ui:define>

</ui:composition>

</html>
